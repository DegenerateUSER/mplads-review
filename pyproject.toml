[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mplads-review-support"
version = "0.1.0"
description = "Local-first MPLADS anomaly review and decision-support API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pyjwt>=2.9",
  "rapidfuzz>=3.9",
  "Pillow>=10.4",
  "python-dotenv>=1.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
]
embeddings = [
  "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "data*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
